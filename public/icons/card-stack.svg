<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CardPilot">
  <rect width="512" height="512" fill="#10211a"/>
  <g transform="translate(256 268)">
    <!-- The runner-up, fanned behind. -->
    <rect x="-150" y="-116" width="300" height="188" rx="24" fill="#136540" transform="rotate(-11)"/>
    <!-- The recommended card, lifted forward, with its magnetic stripe. -->
    <g transform="rotate(6)">
      <rect x="-150" y="-96" width="300" height="188" rx="24" fill="#1a8a53"/>
      <rect x="-150" y="-42" width="300" height="36" fill="#10211a"/>
    </g>
  </g>
</svg>
